worker_processes 1;
events { worker_connections 1024; }
http {
    # Docker DNS and shared upstream state support returning/recreated API nodes.
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 2s;
    log_format measured escape=json '{"time":"$time_iso8601","request":"$request",'
        '"status":$status,"upstream":"$upstream_addr","upstream_status":"$upstream_status",'
        '"request_seconds":$request_time,"upstream_seconds":"$upstream_response_time"}';
    access_log /dev/stdout measured;
    error_log /dev/stderr warn;
    upstream api_pool {
        zone api_pool 64k;
        server api1:5000 resolve max_fails=1 fail_timeout=5s;
        server api2:5000 resolve max_fails=1 fail_timeout=5s;
        server api3:5000 resolve max_fails=1 fail_timeout=5s;
        keepalive 32;
    }
    server {
        listen 80;
        client_max_body_size 2m;
        location / {
            proxy_pass http://api_pool;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $request_id;
            proxy_connect_timeout 1s;
            proxy_send_timeout 7s;
            proxy_read_timeout 7s;
            proxy_next_upstream error timeout http_502;
            proxy_next_upstream_tries 3;
            proxy_next_upstream_timeout 8s;
            # Do not add non_idempotent or hide MongoDB 503 responses.
        }
    }
}
